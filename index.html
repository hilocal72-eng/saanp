
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnakeQuest Social</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnakeQuest">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Righteous&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          overscroll-behavior-y: contain;
          background-color: #020617;
        }
        
        .font-righteous { font-family: 'Righteous', cursive; }

        .glass {
          background: rgba(15, 23, 42, 0.8);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }

        @keyframes spark-burst {
          0% { 
            transform: translate(0, 0) scale(1); 
            opacity: 1; 
          }
          20% { opacity: 1; }
          100% { 
            transform: translate(var(--dx), var(--dy)) scale(0); 
            opacity: 0; 
          }
        }

        @keyframes flash-burst {
          0% { transform: scale(0); opacity: 0; }
          10% { transform: scale(1.5); opacity: 1; }
          100% { transform: scale(2.5); opacity: 0; }
        }

        @keyframes winner-zoom-pulse {
          0% { transform: scale(0.85); filter: brightness(1); }
          50% { transform: scale(1.1); filter: brightness(1.2); }
          100% { transform: scale(0.85); filter: brightness(1); }
        }

        @keyframes reaction-pop-fade {
          0% { transform: scale(0.2) rotate(-15deg); opacity: 0; }
          25% { transform: scale(1.8) rotate(10deg); opacity: 1; }
          50% { transform: scale(1.5) rotate(-5deg); opacity: 1; }
          100% { transform: scale(2.2) rotate(0deg); opacity: 0; }
        }

        @keyframes confetti-fall {
          0% { transform: translateY(-20%) rotate(0deg); opacity: 1; }
          100% { transform: translateY(120%) rotate(720deg); opacity: 0; }
        }

        @keyframes shine-sweep {
          0% { transform: translateX(-150%) skewX(-25deg); }
          20%, 100% { transform: translateX(150%) skewX(-25deg); }
        }

        @keyframes dice-shake {
          0%, 100% { transform: translate(0, 0) rotate(0); }
          25% { transform: translate(-2px, -2px) rotate(-5deg); }
          50% { transform: translate(2px, 1px) rotate(5deg); }
          75% { transform: translate(-1px, 2px) rotate(-3deg); }
        }

        @keyframes dice-pop {
          0% { transform: scale(1.2); }
          100% { transform: scale(1); }
        }

        @keyframes text-flicker-glow {
          0%, 100% { opacity: 1; text-shadow: 0 0 4px rgba(99, 102, 241, 0.2); }
          50% { opacity: 0.6; text-shadow: 0 0 15px rgba(99, 102, 241, 0.8); }
        }

        /* Floating effects for game lobby */
        @keyframes title-float {
          0%, 100% { transform: translateY(0) rotate(-1deg); }
          50% { transform: translateY(-12px) rotate(1deg); }
        }

        @keyframes subtitle-pulse {
          0%, 100% { transform: scale(1) opacity: 0.8; }
          50% { transform: scale(1.05) opacity: 1; }
        }

        @keyframes float-x {
          0%, 100% { transform: translateX(-48px) translateY(0); }
          50% { transform: translateX(-52px) translateY(-5px); }
        }

        @keyframes float-x-delayed {
          0%, 100% { transform: translateX(48px) translateY(0); }
          50% { transform: translateX(52px) translateY(-5px); }
        }

        .animate-spark {
          animation: spark-burst 1.2s cubic-bezier(0, 0.5, 0.2, 1) infinite;
        }

        .animate-flash {
          animation: flash-burst 1.2s ease-out infinite;
        }

        .animate-winner-zoom {
          animation: winner-zoom-pulse 3s ease-in-out infinite;
        }

        .animate-reaction-pop {
          animation: reaction-pop-fade 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-dice-tumble {
          animation: dice-shake 0.1s infinite;
        }

        .animate-dice-settle {
          animation: dice-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .animate-confetti-fall {
          animation: confetti-fall linear forwards;
        }

        .animate-text-glow-pulse {
          animation: text-flicker-glow 2s ease-in-out infinite;
        }

        /* Lobby animation class mapping */
        .animate-title-float {
          animation: title-float 4s ease-in-out infinite;
        }

        .animate-subtitle-pulse {
          animation: subtitle-pulse 3s ease-in-out infinite;
        }

        .animate-float-x {
          animation: float-x 5s ease-in-out infinite;
        }

        .animate-float-x-delayed {
          animation: float-x-delayed 5s ease-in-out infinite;
          animation-delay: -2.5s;
        }

        .shine-effect {
          position: relative;
          overflow: hidden;
        }

        .shine-effect::after {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 50%;
          height: 100%;
          background: linear-gradient(
            to right,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.6) 50%,
            rgba(255, 255, 255, 0) 100%
          );
          animation: shine-sweep 4s infinite linear;
          pointer-events: none;
        }

        .text-glow-yellow {
          text-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 0 0 40px rgba(251, 191, 36, 0.4), 0 4px 0 rgba(0,0,0,0.8);
        }

        .gold-drop-shadow {
          filter: drop-shadow(0 0 12px rgba(251, 191, 36, 0.4));
        }

        @supports (padding: env(safe-area-inset-bottom)) {
          nav {
            padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)) !important;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom": "https://esm.sh/react-dom@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "path": "https://esm.sh/path@^0.12.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "@/": "./",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-indigo-500/30">
    <div id="root"></div>
    <div id="portal-root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
