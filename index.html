
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnakeQuest Social</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SnakeQuest">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/5260/5260498.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { 
          font-family: 'Inter', sans-serif; 
          -webkit-font-smoothing: antialiased;
          -moz-osx-font-smoothing: grayscale;
          overscroll-behavior-y: contain;
          background-color: #020617; /* Matches slate-950 */
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .glass {
          background: rgba(15, 23, 42, 0.8);
          backdrop-filter: blur(12px);
          -webkit-backdrop-filter: blur(12px);
        }

        @keyframes pulse-soft {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.8; transform: scale(0.98); }
        }
        .animate-pulse-soft {
          animation: pulse-soft 2s infinite ease-in-out;
        }

        /* Realistic Dice Physics Animations */
        @keyframes dice-tumble {
          0% { transform: scale(1) rotate(0deg) translate(0, 0); }
          20% { transform: scale(1.1) rotate(45deg) translate(2px, -4px); }
          40% { transform: scale(0.9) rotate(-30deg) translate(-3px, 2px); }
          60% { transform: scale(1.1) rotate(15deg) translate(3px, -2px); }
          80% { transform: scale(0.95) rotate(-10deg) translate(-1px, 1px); }
          100% { transform: scale(1) rotate(0deg) translate(0, 0); }
        }

        @keyframes dice-settle {
          0% { transform: scale(1.4); filter: brightness(1.5); }
          40% { transform: scale(0.85); filter: brightness(1.2); }
          70% { transform: scale(1.1); filter: brightness(1); }
          100% { transform: scale(1); filter: brightness(1); }
        }

        .animate-dice-tumble {
          animation: dice-tumble 0.15s infinite linear;
        }

        .animate-dice-settle {
          animation: dice-settle 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Fix for iOS bottom bar padding in standalone mode */
        @supports (padding: env(safe-area-inset-bottom)) {
          nav {
            padding-bottom: calc(0.5rem + env(safe-area-inset-bottom)) !important;
          }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-950 text-slate-100 overflow-x-hidden selection:bg-indigo-500/30">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW registration failed:', err));
        });
      }
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
